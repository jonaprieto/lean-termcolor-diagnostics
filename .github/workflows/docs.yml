name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'docbuild/lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            .lake
            docbuild/.lake
          key: lake-docs-${{ runner.os }}-${{ hashFiles('lakefile.lean', 'docbuild/lakefile.toml', 'docbuild/lean-toolchain', 'lean-toolchain') }}
          restore-keys: lake-docs-${{ runner.os }}-
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build API docs
        run: |
          lake -d docbuild update
          lake -d docbuild build TermColor.Diagnostics:docs
          touch docbuild/.lake/build/doc/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docbuild/.lake/build/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
