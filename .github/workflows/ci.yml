name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean style (100-col / trailing-ws / tabs)
        run: python3 scripts/style-check.py
      - name: Git whitespace
        run: git diff --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lakefile.lean', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - uses: leanprover/lean-action@v1
        with:
          build-args: "TermColor.Diagnostics TermColor.Diagnostics.Properties tests readme demo"
      - name: Run tests
        run: ./.lake/build/bin/tests
      - name: Verify README examples
        run: ./.lake/build/bin/readme >/dev/null
      - name: Audit proof axioms
        run: python3 scripts/check-axioms.py
