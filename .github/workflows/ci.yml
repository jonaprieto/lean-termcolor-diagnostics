name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean style (100-col / trailing-ws / tabs)
        run: python3 scripts/style-check.py
      - name: Git whitespace
        run: git diff --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lakefile.lean', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - name: Fetch pinned Lake dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: bearer $GH_TOKEN"
          mkdir -p .lake/packages
          if [ ! -d .lake/packages/termcolor/.git ]; then
            git clone --depth=1 https://github.com/jonaprieto/lean-termcolor.git \
              .lake/packages/termcolor
          fi
          if [ ! -d .lake/packages/termcolor-layout/.git ]; then
            git clone --depth=1 https://github.com/jonaprieto/lean-termcolor-layout.git \
              .lake/packages/termcolor-layout
          fi
          git -C .lake/packages/termcolor fetch --depth=1 origin \
            f0c0cef08a9c0c2019929856d48c6ba46458a26f
          git -C .lake/packages/termcolor-layout fetch --depth=1 origin \
            d8c68e5f32ebd21a85c834923c95e113599da7a6
          git -C .lake/packages/termcolor checkout --detach \
            f0c0cef08a9c0c2019929856d48c6ba46458a26f
          git -C .lake/packages/termcolor-layout checkout --detach \
            d8c68e5f32ebd21a85c834923c95e113599da7a6
      - uses: leanprover/lean-action@v1
        with:
          build-args: "TermColor.Diagnostics TermColor.Diagnostics.Properties tests readme demo"
      - name: Run tests
        run: ./.lake/build/bin/tests
      - name: Verify README examples
        run: ./.lake/build/bin/readme >/dev/null
      - name: Audit proof axioms
        run: python3 scripts/check-axioms.py
