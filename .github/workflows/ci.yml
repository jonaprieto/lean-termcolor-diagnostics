name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jonaprieto/precommit-lean/.github/actions/precommit@v0.1.6
        with:
          token: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
          skip: lean-axioms
      - name: Git whitespace
        run: git diff --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v6
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lakefile.lean', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      # Let Lake do the cloning, with credentials rewritten in. Pre-cloning the
      # dependencies here means repeating their revisions, which then go stale on
      # every pin bump, and Lake re-clones (without credentials) as soon as the
      # stored URL disagrees with the one in the lakefile.
      - name: Configure private ecosystem URL
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: leanprover/lean-action@v1
        with:
          build-args: "TermColor.Diagnostics TermColor.Diagnostics.Properties tests detect readme demo"
      - name: Run tests
        run: ./.lake/build/bin/tests
      - name: Verify terminal policies
        run: |
          env -u NO_COLOR -u FORCE_COLOR TERM=xterm ./.lake/build/bin/detect plain
          env -u NO_COLOR FORCE_COLOR=1 TERM=xterm ./.lake/build/bin/detect ansi16
          env -u NO_COLOR FORCE_COLOR=1 TERM=xterm-256color ./.lake/build/bin/detect ansi256
          env -u NO_COLOR FORCE_COLOR=1 TERM=xterm COLORTERM=truecolor \
            ./.lake/build/bin/detect truecolor
          env NO_COLOR=1 FORCE_COLOR=1 TERM=xterm ./.lake/build/bin/detect plain
          env -u NO_COLOR FORCE_COLOR=1 TERM=dumb ./.lake/build/bin/detect plain
      - name: Verify README examples
        run: ./.lake/build/bin/readme >/dev/null
      - name: Render demo gallery
        run: ./.lake/build/bin/demo >/dev/null
      - uses: jonaprieto/precommit-lean/.github/actions/precommit@v0.1.6
        with:
          token: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
          hooks: lean-axioms
