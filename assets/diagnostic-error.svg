<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">termcolor-diagnostics source annotated error</title>
  <desc id="desc">A dark terminal showing a colored invalid duration diagnostic with source context, a note, and a help suggestion.</desc>
  <rect width="1200" height="520" rx="18" fill="#1e1e2e"/>
  <rect width="1200" height="54" rx="18" fill="#292b3b"/>
  <rect y="36" width="1200" height="18" fill="#292b3b"/>
  <circle cx="30" cy="27" r="8" fill="#f38ba8"/>
  <circle cx="56" cy="27" r="8" fill="#f9e2af"/>
  <circle cx="82" cy="27" r="8" fill="#a6e3a1"/>
  <text x="112" y="34" fill="#a6adc8" font-family="SFMono-Regular,Menlo,monospace" font-size="19">termcolor-diagnostics  •  true color</text>
  <text x="38" y="102" fill="#f38ba8" font-family="SFMono-Regular,Menlo,monospace" font-size="25" font-weight="700"><tspan text-decoration="underline">error</tspan><tspan> [E1001]</tspan></text>
  <text x="255" y="102" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="25">: invalid duration</text>
  <text x="74" y="141" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="22">╰─&gt; <tspan fill="#94e2d5" font-weight="700">config.toml</tspan><tspan>:1:11</tspan></text>
  <text x="74" y="178" fill="#6c7086" font-family="SFMono-Regular,Menlo,monospace" font-size="22">│</text>
  <text x="30" y="221" fill="#a6adc8" font-family="SFMono-Regular,Menlo,monospace" font-size="22">1 │</text>
  <text x="110" y="221" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="22">timeout = 2x</text>
  <text x="74" y="260" fill="#6c7086" font-family="SFMono-Regular,Menlo,monospace" font-size="22">│</text>
  <text x="240" y="260" fill="#f38ba8" font-family="SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700">^^</text>
  <text x="395" y="260" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="22">expected a duration</text>
  <text x="74" y="299" fill="#6c7086" font-family="SFMono-Regular,Menlo,monospace" font-size="22">│</text>
  <text x="30" y="338" fill="#a6adc8" font-family="SFMono-Regular,Menlo,monospace" font-size="22">2 │</text>
  <text x="110" y="338" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="22">workers = 4</text>
  <text x="74" y="377" fill="#6c7086" font-family="SFMono-Regular,Menlo,monospace" font-size="22">│</text>
  <text x="38" y="420" fill="#6c7086" font-family="SFMono-Regular,Menlo,monospace" font-size="22"><tspan text-decoration="underline">note</tspan><tspan>:</tspan></text>
  <text x="145" y="420" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="22">durations use a number followed by s, m, or h</text>
  <text x="38" y="464" fill="#a6e3a1" font-family="SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700"><tspan text-decoration="underline">help</tspan><tspan>:</tspan></text>
  <text x="145" y="464" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="22">try timeout = 2m</text>
</svg>
